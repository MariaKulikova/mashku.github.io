# Nginx static server для mashku (Docusaurus)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # За TLS-терминирующим Gateway: относительные редиректы директорий
    # (/ru → /ru/), чтобы nginx не понижал схему до http:// и не светил порт.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Долгий кэш для fingerprint-ассетов Docusaurus (assets/*).
    # ВАЖНО: add_header в location ПЕРЕКРЫВАЕТ серверные add_header (не
    # наследует), поэтому security-заголовки дублируем здесь — иначе js/css/
    # шрифты/svg уходят без nosniff и clickjacking-защиты.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Docusaurus с trailingSlash: false отдаёт чистый URL /projects/foo
    # из файла /projects/foo.html. Поэтому пробуем: файл → файл.html →
    # директория → 404. Это НЕ SPA-fallback (у сайта реальные HTML-страницы).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Кастомная 404-страница Docusaurus с корректным статусом
    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
}
